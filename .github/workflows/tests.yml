name: Core tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    env:
      MPLCONFIGDIR: ${{ github.workspace }}/outputs/.mplcache
      GC_TIDAL_STUDY: ${{ github.workspace }}/outputs/external-selection-not-bundled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: mkdir -p outputs
      - run: python -m unittest test_model test_extent test_dynamics test_mass_evolution test_joint_grid test_profile_recovery test_dense_convergence test_validation test_production test_science_validation test_batch_dynamics test_grid_reuse test_response_shared test_survey_queue
